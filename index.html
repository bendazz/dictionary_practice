    // ── State ──
    let currentQuestion = 0;

    // ── Render the data reference ──
    function renderDataReference() {
        const el = document.getElementById('dataContent');
        const lines = ['reports = ['];
        reports.forEach((r, i) => {
            lines.push('    {');
            Object.entries(r).forEach(([k, v]) => {
                const val = typeof v === 'string' ? `"${v}"` : v;
                lines.push(`        "${k}": ${val},`);
            });
            lines.push('    },');
        });
        lines.push(']');
        el.textContent = lines.join('\n');
    }

    function toggleData() {
        document.getElementById('dataReference').classList.toggle('visible');
    }

    // ── Build navigation buttons ──
    function renderNav() {
        const nav = document.getElementById('questionNav');
        nav.innerHTML = '';
        if (questions.length === 0) return;

        questions.forEach((_, i) => {
            const btn = document.createElement('button');
            btn.textContent = i + 1;
            btn.className = i === currentQuestion ? 'active' : '';
            btn.onclick = () => goTo(i);
            nav.appendChild(btn);
        });
    }

    // ── Render the current question ──
    function renderQuestion() {
        const area = document.getElementById('questionArea');
        const navBtns = document.getElementById('navButtons');

        if (questions.length === 0) {
            area.innerHTML = '<div class="no-questions">Questions will appear here as they are added.</div>';
            navBtns.style.display = 'none';
            return;
        }

        navBtns.style.display = 'flex';
        const q = questions[currentQuestion];
        const qNum = currentQuestion + 1;

        let html = `
            <div class="question-card">
                <div class="question-number">Question ${qNum} of ${questions.length}</div>
                <div class="question-text">${q.title}</div>
                <div class="answer-section">`;

        if (q.output) {
            html += `
                    <button class="toggle-btn output-btn" onclick="toggleBlock('outputBlock', this)">Show Expected Output</button>
                    <div class="answer-block" id="outputBlock">
                        <div class="answer-label">Expected Output</div>
                        <pre>${escapeHtml(q.output)}</pre>
                    </div>`;
        }

        html += `
                    <button class="toggle-btn answer-btn" onclick="toggleBlock('answerBlock', this)">Show Answer</button>
                    <div class="answer-block" id="answerBlock">
                        <div class="answer-label">Sample Solution</div>
                        <pre><code>${escapeHtml(q.code)}</code></pre>
                    </div>
                </div>
            </div>`;

        area.innerHTML = html;

        document.getElementById('prevBtn').disabled = currentQuestion === 0;
        document.getElementById('nextBtn').disabled = currentQuestion === questions.length - 1;
    }

    function toggleBlock(blockId, btn) {
        const block = document.getElementById(blockId);
        const isVisible = block.classList.toggle('visible');
        const label = blockId === 'outputBlock' ? 'Expected Output' : 'Answer';
        btn.textContent = isVisible ? `Hide ${label}` : `Show ${label}`;
    }

    function goTo(index) {
        currentQuestion = index;
        renderNav();
        renderQuestion();
    }

    function navigate(dir) {
        const next = currentQuestion + dir;
        if (next >= 0 && next < questions.length) goTo(next);
    }

    function escapeHtml(str) {
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // ── Init ──
    renderDataReference();
    renderNav();
    renderQuestion();
    </script>
